[project]
name = "algorithmic-trading-journey"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Parada", email = "dfdo.parada@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "nbformat>=5.11.1",
    "pandas>=3.1.1",
    "plotly>=7.2.0",
    "pyarrow>=26.0.1",
